spring:
  application:
    name: damai-learning

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/damai_learning?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: damai-learning-order-paid
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: com.damai.learning.order.message.model
        spring.json.value.default.type: com.damai.learning.order.message.model.OrderPaidMessage


server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

order:
  timeout:
    # 新订单默认支付时限，单位：分钟
    payment-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:15}

    # 扫描超时订单的间隔，单位：毫秒
    scan-delay-ms: ${ORDER_TIMEOUT_SCAN_DELAY_MS:60000}

  message:
    send:
      # 扫描待发送消息的间隔，单位：毫秒
      scan-delay-ms: ${ORDER_MESSAGE_SEND_SCAN_DELAY_MS:5000}